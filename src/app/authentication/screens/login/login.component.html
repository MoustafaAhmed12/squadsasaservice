<nav
  class="fixed top-0 flex items-center w-screen h-24 bg-white border-b-2 border-gray-600 shadow-md text-mainBlack ps-20"
>
  <div routerLink="/" class="w-24 cursor-pointer">
    <h1 class="text-3xl font-semibold">
      Fik<span
        class="text-transparent bg-gradient-to-r from-mainGreen to-tertiartGreen bg-clip-text"
        style="-webkit-text-fill-color: transparent"
        >er

    </h1>
  </div>
</nav>

        class="text-sm cursor-pointer hover:underline"

      </h4>
    </div>

      } <span [class.ps-2]="isLoading">Login</span>

        Forgot password
      </h2>
      <h4 class="mb-8 text-sm font-semibold text-left">
        Enter your e-mail to send a code
      </h4>
    </div>
    <div class="mb-6">
      <input
        id="email"
        type="email"
        #email
        class="w-full px-4 py-3 mb-4 font-semibold bg-transparent border-b-2 outline-none border-fGradient focus:ring-0"
        placeholder="Enter your email"
      />
    </div>
    <button
      type="button"
      (click)="sentEmail(email.value)"
      class="flex items-center justify-center px-10 py-2 text-xl rounded-md bg-mainGreen text-mainWhite"
    >
      @if (isLoadingF) {
      <div
        class="w-6 h-6 border-4 border-[#3c193a] border-solid rounded-full animate-spin border-t-transparent"
      ></div>

      } <span [class.ps-2]="isLoadingF">Send OTP</span>
    </button>
  </form>
  } @case (3) {

      Enter your code

      OTP has been sent to {{ email }}
    </h4>

      <div class="flex mb-4 space-x-4">
        <input
          [disabled]="isLoadingO"
          #input1
          type="text"
          (focus)="empty(input1)"
          (keyup)="moveToNext($event, input2)"

          max="9"
          min="0"
          class="border w-16 focus:outline-0 border-[#e1e4e4] rounded-lg focus:ring-2 focus:ring-subColor1 text-center font-semibold bg-transparent py-6 text-4xl"

        />

          [disabled]="isLoadingO"
          [maxLength]="1"

          type="text"

        />
      </div>
    </div>

        type="button"
        class="font-bold underline"

        <img
          class="w-8 h-8 animate-spin text-purple-950"
          src="https://www.svgrepo.com/show/474682/loading.svg"

    </p>
