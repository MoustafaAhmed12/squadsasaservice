<div class="w-screen h-full md:pt-0">
  <div class="relative z-40">
    <h1 class="text-5xl leading-tight text-white px-7 md:text-5xl lg:text-8xl">
      Technologies
    </h1>
    <div
      class="grid grid-cols-2 gap-2 px-4 mx-auto mt-8 md:gap-4 md:grid-cols-4 lg:grid-cols-6 md:ps-8 max-w-7xl"
    >
      @for (item of allTechnologies; track item.id) {

      <button
        routerLink="configurator"
        [queryParams]="{ techId: item.id }"
        class="bg-[#1f2937] hover:bg-gradient-to-r transition-all duration-500 hover:scale-105 flex items-center gap-x-4 px-5 from-pink-400 via-purple-500 to-blue-500 font-semibold ps-3 text-left py-4 text-sm rounded-md text-mainWhite"
      >
        <img [src]="item.iconUrl" [alt]="item.name" class="size-6" />
        <span>{{ item.name }}</span>
      </button>
      }
    </div>
  </div>
  <div class="absolute inset-y-0 z-0 pt-28 left-5">
    <img
      src="3.png"
      class="object-fill w-full h-full opacity-80"
      alt="Here Image"
    />
  </div>
</div>
