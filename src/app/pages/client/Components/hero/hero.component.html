<div class="grid w-full h-full grid-cols-1">
  <div
    class="relative z-50 w-full pt-0 md:w-7/12 ps-4 text-mainBlack md:ps-0 md:pt-28"
  >
    <h1
      class="pt-16 text-4xl font-black leading-tight md:pt-0 pe-8 md:text-5xl lg:text-6xl"
    >
      GET THE REQUIRED
      <span
        class="text-transparent bg-gradient-to-r from-mainGreen to-tertiartGreen bg-clip-text"
        style="-webkit-text-fill-color: transparent"
        >IT SQUAD </span
      >WITHIN
      <br />
      48-72 HOURS!
    </h1>
    <button
      routerLink="configurator"
      [queryParams]="{ catId: '0' }"
      class="px-10 py-4 mt-10 text-lg font-bold transition-colors rounded-lg outline-none md:text-2xl hover:bg-tertiartGreen text-mainWhite bg-mainGreen"
    >
      CREATE YOUR SQUAD
    </button>
  </div>
  <div class="absolute inset-y-0 right-0">
    <img
      src="hero.png"
      class="object-cover w-full h-full opacity-70 -skew-x-1"
      alt="Here Image"
      loading="lazy"
    />
  </div>
</div>
