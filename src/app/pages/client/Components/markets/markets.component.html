<div class="flex items-center justify-center w-full gap-x-6">
  <div class="">
    <h2 class="text-5xl font-light text-white sm:text-6xl xl:text-8xl">
      Markets
    </h2>
  </div>
  <!-- <div class="w-1 rounded-md h-[calc(100vh-8rem)] bg-mainWhite"></div> -->
  <div class="border-l-[3px] border-white ps-3">
    @for (market of allMarkets; track market.id) {
    <div class="block">
      <div
        class="inline-block p-2 text-lg font-black text-white uppercase transition duration-500 transform cursor-pointer 2xl:text-2xl lg:p-1 2xl:p-3 font-montserrat hover:scale-110 hover:text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-500 to-blue-500"
      >
        <a routerLink="configurator" [queryParams]="{ catId: market.id }">{{
          market.name
        }}</a>
      </div>
    </div>
    }
  </div>
</div>
