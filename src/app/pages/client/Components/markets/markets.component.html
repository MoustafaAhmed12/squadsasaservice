<div
  class="flex flex-col items-center justify-center w-full md:flex-row gap-x-6"
>
  <h2
    class="pb-6 text-5xl font-light text-left text-white md:pb-0 sm:text-6xl xl:text-8xl"
  >
    Markets
  </h2>

  <div
    class="md:border-l-[3px] pt-4 md:pt-0 ms-10 md:ms-0 w-screen md:w-full md:border-t-0 border-t-[3px] border-white md:ps-3"
  >
    @for (market of allMarkets; track market.id) {
    <div class="block">
      <div
        class="inline-block p-2 text-base font-black text-white uppercase transition duration-500 transform cursor-pointer md:text-lg 2xl:text-2xl lg:p-1 2xl:p-3 font-montserrat hover:scale-110 hover:text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-500 to-blue-500"
      >
        <a routerLink="configurator" [queryParams]="{ catId: market.id }">{{
          market.name
        }}</a>
      </div>
    </div>
    }
  </div>
</div>
